<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universal Dino Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 150px;
            border-bottom: 2px solid #535353;
            background-color: #f7f7f7;
        }
        #dino {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 24px;
            height: 35px;
            background-color: #535353;
        }
        #dino.ducking {
            height: 18px;
            width: 38px;
        }
        /* Dynamic Obstacle Profiles */
        .obstacle {
            position: absolute;
            background-color: #535353;
        }
        .cactus-single {
            bottom: 0;
            width: 16px;
            height: 30px;
        }
        .cactus-cluster {
            bottom: 0;
            width: 34px;
            height: 28px;
        }
        .bird-high {
            bottom: 24px; /* MUST DUCK: Clears jumping dino, hits standing dino */
            width: 26px;
            height: 14px;
            border-radius: 4px;
        }
        .bird-low {
            bottom: 5px; /* MUST JUMP: Sweeps across the ground floor */
            width: 26px;
            height: 14px;
            border-radius: 4px;
        }
        #score-board {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
            color: #535353;
            white-space: pre;
        }
        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #535353;
            font-weight: bold;
            text-align: center;
            z-index: 10;
        }
        #controls {
            margin-top: 25px;
            display: flex;
            gap: 30px;
        }
        .btn {
            width: 100px;
            height: 60px;
            background-color: #e0e0e0;
            border: 2px solid #535353;
            border-radius: 10px;
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            color: #535353;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #bcbcbc;
        }
        @media (pointer: fine) {
            #controls { display: none; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">HI 00000  00000</div>
        <div id="game-over-text">GAME OVER<br><br>Tap Screen or Press Space to Restart</div>
        <div id="dino"></div>
        <div id="obstacle" class="obstacle cactus-single"></div>
    </div>

    <div id="controls">
        <div id="jump-btn" class="btn">JUMP</div>
        <div id="duck-btn" class="btn">DUCK</div>
    </div>

    <script>
        const dino = document.getElementById("dino");
        const obs = document.getElementById("obstacle");
        const scoreBoard = document.getElementById("score-board");
        const gameOverText = document.getElementById("game-over-text");
        const jumpBtn = document.getElementById("jump-btn");
        const duckBtn = document.getElementById("duck-btn");

        let isJumping = false;
        let isDucking = false;
        let score = 0;
        let highScore = localStorage.getItem("dino_highscore") ? parseInt(localStorage.getItem("dino_highscore")) : 0;
        let gameInterval;
        let obsPosition = 600;
        let gameSpeed = 6;
        let isGameOver = false;

        function updateScoreDisplay() {
            let sStr = score.toString().padStart(5, '0');
            let hStr = highScore.toString().padStart(5, '0');
            scoreBoard.innerText = `HI ${hStr}  ${sStr}`;
        }

        function jump() {
            if (isJumping || isDucking || isGameOver) return;
            isJumping = true;
            let position = 0;
            
            let upInterval = setInterval(() => {
                if (position >= 95) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        }
                        if (isDucking) {
                            position -= 8; // Mid-air cancel fast fall
                        } else {
                            position -= 5;
                        }
                        if(position < 0) position = 0;
                        dino.style.bottom = position + "px";
                    }, 20);
                }
                position += 6;
                dino.style.bottom = position + "px";
            }, 20);
        }

        function startDuck() {
            if (isGameOver) return;
            isDucking = true;
            if (!isJumping) {
                dino.classList.add("ducking");
            }
        }

        function stopDuck() {
            isDucking = false;
            dino.classList.remove("ducking");
        }

        // Varied Obstacle Spawner System
        function spawnNewObstacle() {
            obsPosition = 600;
            let typePool = ["cactus-single", "cactus-cluster"];
            
            // Pterodactyls unlock starting at 5 points
            if (score >= 5) {
                typePool.push("bird-high", "bird-low");
            }

            // Pick randomly from the pool
            let chosenType = typePool[Math.floor(Math.random() * typePool.length)];
            obs.className = "obstacle " + chosenType;
        }

        function startGameLoop() {
            gameInterval = setInterval(() => {
                if (isGameOver) return;

                obsPosition -= gameSpeed;
                if (obsPosition < -40) {
                    score++;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("dino_highscore", highScore);
                    }
                    updateScoreDisplay();
                    
                    if (score % 5 === 0) gameSpeed += 0.5; // Smooth progression curve
                    spawnNewObstacle();
                }
                obs.style.left = obsPosition + "px";

                let dinoRect = dino.getBoundingClientRect();
                let obsRect = obs.getBoundingClientRect();

                // Tight hitbox margins
                if (
                    dinoRect.right - 4 > obsRect.left &&
                    dinoRect.left + 4 < obsRect.right &&
                    dinoRect.bottom - 2 > obsRect.top &&
                    dinoRect.top + 2 < obsRect.bottom
                ) {
                    endGame();
                }
            }, 20);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            gameOverText.style.display = "block";
        }

        function restartGame() {
            score = 0;
            gameSpeed = 6;
            isGameOver = false;
            gameOverText.style.display = "none";
            dino.style.bottom = "0px";
            stopDuck();
            spawnNewObstacle();
            updateScoreDisplay();
            startGameLoop();
        }

        // --- COMPUTER CONTROLS ---
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (isGameOver) restartGame(); else jump();
            }
            if (e.code === "ArrowDown") {
                e.preventDefault();
                startDuck();
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.code === "ArrowDown") {
                stopDuck();
            }
        });

        // --- IPAD / TOUCH CONTROL MAPPINGS ---
        document.getElementById("game-container").addEventListener("touchstart", (e) => {
            if (isGameOver) {
                e.preventDefault();
                restartGame();
            }
        });

        jumpBtn.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        duckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startDuck(); });
        duckBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopDuck(); });

        jumpBtn.addEventListener("mousedown", jump);
        duckBtn.addEventListener("mousedown", startDuck);
        duckBtn.addEventListener("mouseup", stopDuck);

        updateScoreDisplay();
        startGameLoop();
    </script>
</body>
</html>
